<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Pipeline"},
  {"id":"nodes","type":"json","label":"Nodes [{label,color?}]","default":[{"label":"Brief"},{"label":"Render"}]},
  {"id":"accent","type":"color","label":"Accent color","default":"#4f8cff"},
  {"id":"bg","type":"color","label":"Background","default":"#0B0E13"},
  {"id":"textColor","type":"color","label":"Text color","default":"#F2F4F8"},
  {"id":"startMs","type":"number","label":"Scene start (ms)","default":0},
  {"id":"sceneMs","type":"number","label":"Scene duration (ms)","default":8000}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0B0E13; }
      body { font-family: "Inter", sans-serif; }
      #camera { position: absolute; inset: 0; transform-origin: 50% 50%; perspective: 1200px; }
      #depth { position: absolute; inset: 0; transform-style: preserve-3d; }
      #root { position: absolute; inset: 0; }
      .orb { position: absolute; border-radius: 50%; filter: blur(130px); will-change: transform; }
      #orb1 { width: 900px; height: 900px; left: -240px; top: -300px; }
      #orb2 { width: 720px; height: 720px; right: -200px; top: 80px; }
      #orb3 { width: 640px; height: 640px; left: 26%; bottom: -260px; }
      #title {
        position: absolute; top: 150px; left: 200px; right: 200px;
        font-size: 64px; font-weight: 700; letter-spacing: -0.02em;
      }
      #pipeline {
        position: absolute; top: 420px; left: 200px; right: 200px;
        display: flex; align-items: center; gap: 0;
        transform: translateZ(60px);
      }
      .node {
        flex: 1; min-width: 0; text-align: center; font-size: 40px; font-weight: 600;
        padding: 46px 20px; border-radius: 22px; position: relative; will-change: transform;
      }
      .node small { display: block; margin-top: 10px; font-size: 22px; font-weight: 500; opacity: 0.6; letter-spacing: 0.12em; }
      .node .ring {
        position: absolute; inset: -8px; border-radius: 28px; border: 3px solid transparent;
        opacity: 0; pointer-events: none;
      }
      .connector { position: relative; width: 130px; height: 8px; border-radius: 999px; overflow: visible; flex: none; }
      .dot {
        position: absolute; width: 26px; height: 26px; border-radius: 50%;
        transform: translate(-50%, -50%); left: 0; top: 50%; will-change: transform, opacity;
      }
      .pulse { position: absolute; left: 0; top: 50%; width: 44px; height: 44px; border-radius: 50%; transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
      #halo { position: absolute; top: 300px; left: 50%; width: 720px; height: 720px; transform: translateX(-50%); filter: blur(90px); opacity: 0; pointer-events: none; }
      #maxlayer { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="verb-pipeline-flow" data-start="0" data-duration="8" data-width="1920" data-height="1080" data-fps="30">
      <div id="camera">
        <div id="depth">
          <div class="orb" id="orb1"></div>
          <div class="orb" id="orb2"></div>
          <div class="orb" id="orb3"></div>
        </div>
        <div id="halo"></div>
      </div>
      <div id="maxlayer"></div>
      <div class="clip" data-start="0" data-duration="7.6" data-track-index="1">
        <div id="title"></div>
        <div id="pipeline"></div>
      </div>
    </div>
    <script>
      const v = window.__hyperframes.getVariables();
      const D = (v.sceneMs || 8000) / 1000;
      const t0 = v.startMs / 1000;
      const ACCENT = v.accent || "#4f8cff";
      const TEXT = v.textColor || "#F2F4F8";
      const BG = v.bg || "#0B0E13";

      const rgba = (hex, a) => {
        const m = /^#?([0-9a-f]{6})$/i.exec(hex);
        if (!m) return `rgba(80,140,255,${a})`;
        const n = parseInt(m[1], 16);
        return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
      };

      document.documentElement.style.background = BG;
      document.documentElement.style.setProperty("--accent", ACCENT);
      document.getElementById("title").textContent = v.title || "";
      document.getElementById("title").style.color = TEXT;
      document.getElementById("halo").style.background = rgba(ACCENT, 0.6);
      for (const [sel, a] of [["#orb1", 0.3], ["#orb2", 0.24], ["#orb3", 0.2]]) {
        document.querySelector(sel).style.background = rgba(ACCENT, a);
      }

      const pipe = document.getElementById("pipeline");
      const nodes = (Array.isArray(v.nodes) && v.nodes.length ? v.nodes : [{ label: "Brief" }, { label: "Render" }]);
      const dots = [];
      nodes.forEach((nd, i) => {
        if (i > 0) {
          const conn = document.createElement("div");
          conn.className = "connector";
          conn.style.background = rgba(ACCENT, 0.25);
          const dot = document.createElement("div");
          dot.className = "dot";
          dot.style.background = ACCENT;
          const pulse = document.createElement("div");
          pulse.className = "pulse";
          pulse.style.background = rgba(ACCENT, 0.5);
          conn.appendChild(dot);
          conn.appendChild(pulse);
          pipe.appendChild(conn);
          dots.push({ dot, conn, pulse });
        }
        const node = document.createElement("div");
        node.className = "node";
        node.style.background = nd.color || rgba(ACCENT, 0.22);
        node.style.color = TEXT;
        const ring = document.createElement("div");
        ring.className = "ring";
        ring.style.borderColor = ACCENT;
        node.appendChild(ring);
        const big = document.createElement("span");
        big.textContent = nd.label;
        node.appendChild(big);
        const small = document.createElement("small");
        small.textContent = `STAGE ${String(i + 1).padStart(2, "0")}`;
        node.appendChild(small);
        node.style.opacity = 0;
        pipe.appendChild(node);
        nd._el = node;
        nd._ring = ring;
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- 1 · ENTRANCE (0 → 40%) ----------
      tl.from("#title", { autoAlpha: 0, y: 30, duration: 0.6, ease: "power3.out" }, t0 + 0.05);
      nodes.forEach((nd, i) => {
        tl.to(nd._el, { autoAlpha: 1, scale: 0.94, duration: 0.55, ease: "back.out(1.6)" }, t0 + 0.35 + i * 0.5);
        if (i > 0) {
          const d = dots[i - 1];
          tl.fromTo(d.conn, { scaleX: 0 }, { scaleX: 1, transformOrigin: "0 50%", duration: 0.45, ease: "power2.out" }, t0 + 0.4 + i * 0.5);
          // flow dot crossing the connector
          tl.fromTo(d.dot, { x: 0, autoAlpha: 1 }, { x: 130, duration: 0.5, ease: "power2.inOut" }, t0 + 0.45 + i * 0.5);
          tl.to(d.dot, { autoAlpha: 0, duration: 0.15 }, t0 + 0.95 + i * 0.5);
          tl.fromTo(d.pulse, { scale: 0.4, autoAlpha: 0.9 }, { scale: 2.2, autoAlpha: 0, duration: 0.6, ease: "power2.out" }, t0 + 0.45 + i * 0.5);
        }
      });

      // ---------- 2 · AMBIENT FLOW (40% → 70%) — data forever moving through the pipe ----------
      const amb = t0 + D * 0.4;
      const flow = { pos: 0 };
      const conns = dots.map((d) => d.conn);
      tl.to(flow, {
        pos: 130, duration: 1.6, ease: "linear", repeat: -1, repeatDelay: 0.35,
        onUpdate: () => {
          const f = Math.floor(flow.pos / 130 * dots.length);
          dots.forEach((d, i) => {
            if (i === f) {
              gsap.set(d.dot, { x: flow.pos % 130 });
            }
          });
        },
      }, amb);
      // simpler robust ambient: each dot loops across its connector
      dots.forEach((d, i) => {
        tl.fromTo(d.dot, { x: 0, autoAlpha: 1 }, { x: 130, autoAlpha: 1, duration: 1.5, ease: "linear", repeat: -1, delay: i * 0.5 }, amb);
        tl.to(d.dot, { autoAlpha: 0, duration: 0.2 }, amb + 1.5 + i * 0.5);
      });
      nodes.forEach((nd, i) => {
        tl.to(nd._el, { y: i % 2 ? 12 : -12, duration: 2.4 + i * 0.3, ease: "sine.inOut", repeat: -1, yoyo: true }, amb);
      });
      tl.to("#title", { opacity: 0.6, duration: 2.0, repeat: -1, yoyo: true, ease: "sine.inOut" }, amb);
      tl.to("#orb1", { x: 220, y: 180, scale: 1.25, duration: 6.0, ease: "sine.inOut", repeat: -1, yoyo: true }, t0);
      tl.to("#orb2", { x: -200, y: -140, scale: 1.2, duration: 6.8, ease: "sine.inOut", repeat: -1, yoyo: true }, t0 + 0.6);
      tl.to("#orb3", { x: 160, y: -200, scale: 1.28, duration: 7.4, ease: "sine.inOut", repeat: -1, yoyo: true }, t0 + 1.1);

      // ---------- 3 · EMPHASIS (70% → 84%) — the output stamps ----------
      const beat = t0 + D * 0.7;
      const last = nodes[nodes.length - 1];
      tl.to(last._el, { scale: 1.06, duration: 0.4, ease: "back.out(1.8)" }, beat);
      tl.to(last._el, { scale: 1, duration: 0.7, ease: "power4.inOut" }, beat + 0.4);
      tl.fromTo(last._ring, { opacity: 0.9 }, { opacity: 0, duration: 1.0, ease: "power2.out" }, beat);
      tl.fromTo("#halo", { opacity: 0.8 }, { opacity: 0, duration: 0.9, ease: "power2.out" }, beat);

      // ---------- 4 · EXIT (92% → 100%) ----------
      const ex = t0 + D * 0.92;
      tl.to(nodes.map((n) => n._el), { x: -80, autoAlpha: 0, duration: 0.55, stagger: 0.07, ease: "power2.in" }, ex);
      tl.to("#title", { autoAlpha: 0, y: -20, duration: 0.45, ease: "power2.in" }, ex + 0.1);

      // ---------- MAX QUALITY · extra ambient particle layer ----------
      if (v.maxMotion) {
        const layer = document.getElementById("maxlayer");
        layer.style.opacity = 1;
        let s = 7755;
        const rnd = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296;
        for (let i = 0; i < 28; i++) {
          const p = document.createElement("div");
          const size = 5 + rnd() * 9;
          p.style.cssText = `position:absolute;width:${size}px;height:${size}px;border-radius:50%;background:${rgba(ACCENT, 0.45)};filter:blur(${(2 + rnd() * 5).toFixed(1)}px);left:${(rnd() * 100).toFixed(1)}%;top:${(rnd() * 100).toFixed(1)}%`;
          layer.appendChild(p);
          tl.to(p, { y: (rnd() - 0.5) * 240, x: (rnd() - 0.5) * 160, opacity: 0.12 + rnd() * 0.3, duration: 3 + rnd() * 4, ease: "sine.inOut", repeat: -1, yoyo: true }, t0 + rnd() * 2);
        }
      }

      window.__timelines["verb-pipeline-flow"] = tl;
    </script>
  </body>
</html>
