<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Pipeline"},
  {"id":"nodes","type":"json","label":"[{label,color}]","default":[{"label":"Input","color":"#4f8cff"},{"label":"Process","color":"#22c55e"},{"label":"Output","color":"#f59e0b"}]},
  {"id":"accent","type":"color","label":"Accent color","default":"#4f8cff"},
  {"id":"startMs","type":"number","label":"Scene start (ms)","default":0},
  {"id":"holdMs","type":"number","label":"Hold (ms)","default":5000}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0e1116; }
      body { font-family: "Inter", sans-serif; color: #f2f4f8; }
      #camera {
        position: absolute; inset: 0; transform-origin: 50% 50%;
        background: radial-gradient(1000px 700px at 50% 20%, #1a2434 0%, #0e1116 70%);
      }
      #root { position: absolute; inset: 0; }
      .clip { position: absolute; inset: 0; }
      #title {
        position: absolute;
        top: 170px; left: 200px; font-size: 56px; font-weight: 700; letter-spacing: -0.01em;
      }
      #pipeline {
        position: absolute;
        top: 400px; left: 200px; right: 200px;
        display: flex; align-items: center;
      }
      .node {
        flex: 1; text-align: center; padding: 40px 20px;
        font-size: 40px; font-weight: 700; letter-spacing: 0.01em;
        border-radius: 18px; color: #0e1116;
        will-change: transform, opacity;
      }
      .connector {
        width: 90px; height: 6px; border-radius: 3px;
        background: #3a4657; transform-origin: 0 50%;
      }
      .dot {
        position: absolute; width: 26px; height: 26px; border-radius: 50%;
        background: var(--accent); transform: translate(-50%, -50%);
        will-change: transform, opacity;
      }
      .connector { position: relative; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="verb-pipeline-flow" data-start="0" data-duration="8" data-width="1920" data-height="1080" data-fps="30">
      <div id="camera"></div>
      <div class="clip" data-start="0" data-duration="7.6" data-track-index="1">
        <div id="title"></div>
        <div id="pipeline"></div>
      </div>
    </div>
    <script>
      const v = window.__hyperframes.getVariables();
      const t = v.startMs / 1000;
      document.documentElement.style.setProperty("--accent", v.accent);
      document.getElementById("title").textContent = v.title;
      const pipe = document.getElementById("pipeline");
      const nodes = Array.isArray(v.nodes) ? v.nodes : [];
      const dots = [];
      nodes.forEach((nd, i) => {
        if (i > 0) {
          const conn = document.createElement("div");
          conn.className = "connector";
          pipe.appendChild(conn);
          const dot = document.createElement("div");
          dot.className = "dot";
          dot.style.left = "50%";
          dot.style.top = "50%";
          conn.appendChild(dot);
          dots.push({ dot, conn });
        }
        const node = document.createElement("div");
        node.className = "node";
        node.style.background = nd.color || v.accent;
        node.textContent = nd.label;
        node.style.opacity = 0;
        pipe.appendChild(node);
        nodes[i].el = node;
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#title", { autoAlpha: 0, y: 24, duration: 0.6, ease: "power3.out" }, t + 0.1);
      nodes.forEach((nd, i) => {
        tl.to(nd.el, { autoAlpha: 1, scale: 0.96, duration: 0.5, ease: "back.out(1.4)" }, t + 0.4 + i * 0.55);
        if (i > 0) {
          // connector draws as the node lands; dot pulses across it (flow signal)
          tl.fromTo(dots[i - 1].conn, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, t + 0.45 + i * 0.55);
          tl.fromTo(dots[i - 1].dot, { x: -40, autoAlpha: 0 }, { x: 40, autoAlpha: 1, duration: 0.5, ease: "power2.inOut" }, t + 0.5 + i * 0.55);
          tl.to(dots[i - 1].dot, { autoAlpha: 0, duration: 0.15 }, t + 1.0 + i * 0.55);
        }
      });
      // highlight pulse on the final node (stamp moment, R: one hero beat)
      const last = nodes[nodes.length - 1].el;
      tl.fromTo(last, { scale: 0.96 }, { scale: 1.05, duration: 0.4, ease: "back.out(1.7)" }, t + 0.4 + (nodes.length - 1) * 0.55 + 0.9);
      tl.to(last, { scale: 1, duration: 0.4, ease: "power2.out" }, t + 0.4 + (nodes.length - 1) * 0.55 + 1.5);

      // camera drift (R1)
      tl.to("#camera", { scale: 1.05, duration: 7.6, ease: "sine.inOut" }, t);

      window.__timelines["verb-pipeline-flow"] = tl;
    </script>
  </body>
</html>
