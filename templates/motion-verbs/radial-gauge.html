<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Progress"},
  {"id":"value","type":"number","label":"Value","default":72},
  {"id":"unit","type":"string","label":"Unit","default":"%"},
  {"id":"label","type":"string","label":"Label","default":"Complete"},
  {"id":"accent","type":"color","label":"Accent color","default":"#4f8cff"},
  {"id":"bg","type":"color","label":"Background","default":"#0B0E13"},
  {"id":"textColor","type":"color","label":"Text color","default":"#F2F4F8"},
  {"id":"startMs","type":"number","label":"Scene start (ms)","default":0},
  {"id":"sceneMs","type":"number","label":"Scene duration (ms)","default":8000}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0B0E13; }
      body { font-family: "Inter", sans-serif; }
      #camera { position: absolute; inset: 0; transform-origin: 50% 50%; perspective: 1200px; }
      #depth { position: absolute; inset: 0; transform-style: preserve-3d; }
      #root { position: absolute; inset: 0; }
      .orb { position: absolute; border-radius: 50%; filter: blur(130px); will-change: transform; }
      #orb1 { width: 900px; height: 900px; left: -240px; top: -300px; }
      #orb2 { width: 720px; height: 720px; right: -200px; top: 80px; }
      #orb3 { width: 640px; height: 640px; left: 26%; bottom: -260px; }
      #title { position: absolute; top: 150px; left: 200px; right: 200px; font-size: 64px; font-weight: 700; letter-spacing: -0.02em; }
      #gaugeWrap { position: absolute; left: 50%; top: 560px; width: 620px; height: 620px; margin: -310px 0 0 -310px; transform: translateZ(70px); }
      #gauge { position: absolute; inset: 0; }
      #halo { position: absolute; left: 50%; top: 560px; width: 720px; height: 720px; margin: -360px 0 0 -360px; border-radius: 50%; filter: blur(90px); opacity: 0; pointer-events: none; }
      #valueNum {
        position: absolute; left: 50%; top: 560px; transform: translate(-50%, -50%);
        font-size: 190px; font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
      }
      #valueNum .unit { font-size: 90px; font-weight: 700; }
      #valueLabel {
        position: absolute; left: 50%; top: 700px; transform: translateX(-50%);
        font-size: 34px; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.75; white-space: nowrap;
      }
      #tick { position: absolute; left: 50%; top: 380px; width: 6px; height: 60px; margin-left: -3px; border-radius: 999px; opacity: 0; }
      #maxlayer { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="verb-radial-gauge" data-start="0" data-duration="8" data-width="1920" data-height="1080" data-fps="30">
      <div id="camera">
        <div id="depth">
          <div class="orb" id="orb1"></div>
          <div class="orb" id="orb2"></div>
          <div class="orb" id="orb3"></div>
        </div>
        <div id="halo"></div>
        <div id="title"></div>
        <div id="gaugeWrap"><svg id="gauge" viewBox="0 0 620 620"></svg></div>
        <div id="valueNum"></div>
        <div id="valueLabel"></div>
        <div id="tick"></div>
      </div>
      <div id="maxlayer"></div>
    </div>
    <script>
      const v = window.__hyperframes.getVariables();
      const D = (v.sceneMs || 8000) / 1000;
      const t0 = v.startMs / 1000;
      const ACCENT = v.accent || "#4f8cff";
      const TEXT = v.textColor || "#F2F4F8";
      const BG = v.bg || "#0B0E13";
      const target = Number(v.value) || 72;

      const rgba = (hex, a) => {
        const m = /^#?([0-9a-f]{6})$/i.exec(hex);
        if (!m) return `rgba(80,140,255,${a})`;
        const n = parseInt(m[1], 16);
        return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
      };

      document.documentElement.style.background = BG;
      document.getElementById("title").textContent = v.title || "";
      document.getElementById("title").style.color = TEXT;
      document.getElementById("valueNum").style.color = TEXT;
      document.getElementById("valueLabel").textContent = (v.label || "").toUpperCase();
      document.getElementById("valueLabel").style.color = ACCENT;
      document.getElementById("tick").style.background = ACCENT;
      document.getElementById("halo").style.background = rgba(ACCENT, 0.55);
      for (const [sel, a] of [["#orb1", 0.3], ["#orb2", 0.24], ["#orb3", 0.2]]) {
        document.querySelector(sel).style.background = rgba(ACCENT, a);
      }

      // --- build the gauge SVG: track ring + progress arc + tick marks ---
      const svg = document.getElementById("gauge");
      const C = 310, R = 250, CIRC = 2 * Math.PI * R;
      const track = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      track.setAttribute("cx", C); track.setAttribute("cy", C); track.setAttribute("r", R);
      track.setAttribute("fill", "none");
      track.setAttribute("stroke", rgba(ACCENT, 0.14));
      track.setAttribute("stroke-width", "34");
      svg.appendChild(track);
      const arc = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      arc.setAttribute("cx", C); arc.setAttribute("cy", C); arc.setAttribute("r", R);
      arc.setAttribute("fill", "none");
      arc.setAttribute("stroke", ACCENT);
      arc.setAttribute("stroke-width", "34");
      arc.setAttribute("stroke-linecap", "round");
      arc.setAttribute("stroke-dasharray", `${CIRC} ${CIRC}`);
      arc.setAttribute("stroke-dashoffset", String(CIRC));
      arc.style.filter = "drop-shadow(0 0 18px " + rgba(ACCENT, 0.55) + ")";
      arc.setAttribute("transform", "rotate(-90 310 310)");
      svg.appendChild(arc);
      // 12 tick marks on the track
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * 2 * Math.PI - Math.PI / 2;
        const x1 = C + Math.cos(a) * (R + 26), y1 = C + Math.sin(a) * (R + 26);
        const x2 = C + Math.cos(a) * (R + 40), y2 = C + Math.sin(a) * (R + 40);
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x1); line.setAttribute("y1", y1);
        line.setAttribute("x2", x2); line.setAttribute("y2", y2);
        line.setAttribute("stroke", rgba(ACCENT, i % 3 === 0 ? 0.5 : 0.25));
        line.setAttribute("stroke-width", "4");
        svg.appendChild(line);
      }

      const numEl = document.getElementById("valueNum");
      numEl.innerHTML = `<span class="num">0</span><span class="unit" style="color:${ACCENT}">${v.unit || ""}</span>`;
      const numSpan = numEl.querySelector(".num");

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- 1 · ENTRANCE ----------
      tl.from("#title", { autoAlpha: 0, y: 30, duration: 0.6, ease: "power3.out" }, t0 + 0.05);
      tl.from("#gaugeWrap", { scale: 0.7, autoAlpha: 0, duration: 0.8, ease: "back.out(1.4)" }, t0 + 0.15);
      tl.from("#valueLabel", { autoAlpha: 0, y: 20, duration: 0.5, ease: "power2.out" }, t0 + 0.5);

      // ---------- 2 · THE FILL (15% → 60%) ----------
      const o = { p: 0 };
      tl.to(o, {
        p: target, duration: D * 0.45, ease: "power2.inOut",
        onUpdate: () => {
          const frac = Math.min(o.p / 100, 1);
          arc.setAttribute("stroke-dashoffset", String(CIRC * (1 - frac)));
          numSpan.textContent = Math.round(o.p).toLocaleString("en-US");
          numSpan.style.transform = `scale(${1 + 0.06 * (1 - frac)})`;
        },
      }, t0 + D * 0.15);
      // rotating tick needle
      tl.fromTo("#tick", { rotation: -60, autoAlpha: 1 }, { rotation: 60, duration: D * 0.6, ease: "power2.inOut" }, t0 + D * 0.15);

      // ---------- 3 · AMBIENT ----------
      const amb = t0 + D * 0.62;
      tl.to("#gaugeWrap", { scale: 1.03, duration: 2.6, ease: "sine.inOut", repeat: -1, yoyo: true }, amb);
      tl.to("#tick", { opacity: 0.35, duration: 1.8, repeat: -1, yoyo: true, ease: "sine.inOut" }, amb);
      tl.to("#title", { opacity: 0.6, duration: 2.0, repeat: -1, yoyo: true, ease: "sine.inOut" }, amb);
      tl.to("#orb1", { x: 220, y: 180, scale: 1.25, duration: 6.0, ease: "sine.inOut", repeat: -1, yoyo: true }, t0);
      tl.to("#orb2", { x: -200, y: -140, scale: 1.2, duration: 6.8, ease: "sine.inOut", repeat: -1, yoyo: true }, t0 + 0.6);
      tl.to("#orb3", { x: 160, y: -200, scale: 1.28, duration: 7.4, ease: "sine.inOut", repeat: -1, yoyo: true }, t0 + 1.1);

      // ---------- 4 · EMPHASIS ----------
      const beat = t0 + D * 0.75;
      tl.to("#gaugeWrap", { scale: 1.09, duration: 0.4, ease: "power2.out" }, beat);
      tl.to("#gaugeWrap", { scale: 1, duration: 0.8, ease: "power4.inOut" }, beat + 0.4);
      tl.fromTo("#halo", { opacity: 0.8 }, { opacity: 0, duration: 0.9, ease: "power2.out" }, beat);
      tl.to(numSpan, { scale: 1.25, duration: 0.35, ease: "back.out(2)" }, beat);
      tl.to(numSpan, { scale: 1, duration: 0.55, ease: "power2.out" }, beat + 0.35);

      // ---------- 5 · EXIT ----------
      const ex = t0 + D * 0.9;
      tl.to("#gaugeWrap", { scale: 0.6, autoAlpha: 0, duration: 0.5, ease: "power2.in" }, ex);
      tl.to("#valueNum, #valueLabel", { y: -40, autoAlpha: 0, duration: 0.45, ease: "power2.in" }, ex + 0.05);
      tl.to("#title", { autoAlpha: 0, y: -20, duration: 0.4, ease: "power2.in" }, ex + 0.05);

      // camera depth rig
      tl.fromTo("#camera", { scale: 1.0 }, { scale: 1.05, duration: D, ease: "sine.inOut" }, t0);
      tl.fromTo("#camera", { rotationX: -0.7, rotationY: 1.2 }, { rotationX: 0.8, rotationY: -1.2, duration: D, ease: "sine.inOut", repeat: -1, yoyo: true }, t0);

      // ---------- MAX QUALITY · particles ----------
      if (v.maxMotion) {
        const layer = document.getElementById("maxlayer");
        layer.style.opacity = 1;
        let s = 9090;
        const rnd = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296;
        for (let i = 0; i < 24; i++) {
          const p = document.createElement("div");
          const size = 5 + rnd() * 9;
          p.style.cssText = `position:absolute;width:${size}px;height:${size}px;border-radius:50%;background:${rgba(ACCENT, 0.45)};filter:blur(${(2 + rnd() * 5).toFixed(1)}px);left:${(rnd() * 100).toFixed(1)}%;top:${(rnd() * 100).toFixed(1)}%`;
          layer.appendChild(p);
          tl.to(p, { y: (rnd() - 0.5) * 220, x: (rnd() - 0.5) * 160, opacity: 0.12 + rnd() * 0.3, duration: 3 + rnd() * 4, ease: "sine.inOut", repeat: -1, yoyo: true }, t0 + rnd() * 2);
        }
      }

      window.__timelines["verb-radial-gauge"] = tl;
    </script>
  </body>
</html>
