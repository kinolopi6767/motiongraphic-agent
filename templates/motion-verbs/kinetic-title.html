<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Headline"},
  {"id":"lines","type":"json","label":"Lines array","default":["Line one","Line two"]},
  {"id":"accent","type":"color","label":"Accent color","default":"#4f8cff"},
  {"id":"accentOn","type":"number","label":"Accent line index (0-based)","default":1},
  {"id":"kicker","type":"string","label":"Kicker","default":""},
  {"id":"bg","type":"color","label":"Background","default":"#0B0E13"},
  {"id":"textColor","type":"color","label":"Text color","default":"#F2F4F8"},
  {"id":"startMs","type":"number","label":"Scene start (ms)","default":0},
  {"id":"sceneMs","type":"number","label":"Scene duration (ms)","default":8000}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0B0E13; }
      body { font-family: "Inter", sans-serif; }
      #camera { position: absolute; inset: 0; transform-origin: 50% 50%; perspective: 1200px; }
      #depth { position: absolute; inset: 0; transform-style: preserve-3d; }
      #root { position: absolute; inset: 0; }
      .orb { position: absolute; border-radius: 50%; filter: blur(130px); will-change: transform; }
      #orb1 { width: 900px; height: 900px; left: -220px; top: -260px; }
      #orb2 { width: 760px; height: 760px; right: -180px; top: 120px; }
      #orb3 { width: 640px; height: 640px; left: 32%; bottom: -260px; }
      #kicker {
        position: absolute; top: 208px; left: 200px; font-size: 26px;
        letter-spacing: 0.34em; text-transform: uppercase; opacity: 0;
        display: inline-block; padding: 10px 22px; border-radius: 999px;
        background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
        backdrop-filter: blur(10px);
      }
      #glowbar { position: absolute; top: 0; height: 6px; width: 0px; left: 196px; border-radius: 999px; opacity: 0; }
      h1 {
        position: absolute; top: 300px; left: 190px; right: 190px;
        font-size: 104px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.08;
        transform: translateZ(60px);
      }
      h1 .line { display: block; overflow: hidden; }
      h1 .line > span { display: inline-block; will-change: transform, filter; }
      #accentglow { position: absolute; left: 188px; right: 188px; height: 96px; top: 0; filter: blur(48px); opacity: 0; pointer-events: none; }
      /* hand-drawn marker underline, drawn AFTER the title settles */
      #marker { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; opacity: 0; }
      #maxlayer { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="verb-kinetic-title" data-start="0" data-duration="8" data-width="1920" data-height="1080" data-fps="30">
      <div id="camera">
        <div id="depth">
          <div class="orb" id="orb1"></div>
          <div class="orb" id="orb2"></div>
          <div class="orb" id="orb3"></div>
        </div>
      </div>
      <div id="maxlayer"></div>
      <div class="clip" data-start="0" data-duration="7.6" data-track-index="1">
        <div id="kicker"></div>
        <div id="glowbar"></div>
        <h1 id="title"></h1>
        <div id="accentglow"></div>
        <svg id="marker" width="2000" height="200"></svg>
      </div>
    </div>
    <script>
      const v = window.__hyperframes.getVariables();
      const D = (v.sceneMs || 8000) / 1000;
      const t0 = v.startMs / 1000;
      const ACCENT = v.accent || "#4f8cff";
      const TEXT = v.textColor || "#F2F4F8";
      const BG = v.bg || "#0B0E13";

      const rgba = (hex, a) => {
        const m = /^#?([0-9a-f]{6})$/i.exec(hex);
        if (!m) return `rgba(80,140,255,${a})`;
        const n = parseInt(m[1], 16);
        return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
      };

      document.documentElement.style.background = BG;
      document.getElementById("kicker").textContent = v.kicker || "";
      document.getElementById("kicker").style.color = ACCENT;
      for (const [i, el] of [["#orb1", 0.35], ["#orb2", 0.28], ["#orb3", 0.22]].entries()) {
        const orb = document.querySelector(el[0]);
        orb.style.background = rgba(ACCENT, el[1]);
      }

      const title = document.getElementById("title");
      const lines = Array.isArray(v.lines) && v.lines.length ? v.lines : [v.title || "Headline"];
      const spans = [];
      lines.forEach((ln, i) => {
        const line = document.createElement("span");
        line.className = "line";
        const inner = document.createElement("span");
        inner.innerHTML = i === v.accentOn ? `<span style="color:${ACCENT}">${ln}</span>` : ln;
        inner.style.color = TEXT;
        line.appendChild(inner);
        title.appendChild(line);
        spans.push(inner);
      });
      const gl = document.getElementById("accentglow");
      gl.style.background = rgba(ACCENT, 0.55);

      /* RECIPE: marker-underline — after the title settles (+4-8f), a
         hand-drawn marker stroke draws under the accent line: fast (10f),
         hugging the type, slightly upward slope following the italic. */
      const marker = document.getElementById("marker");
      const drawMarker = () => {
        const accentSpan = spans[v.accentOn] ?? spans[spans.length - 1];
        const r = accentSpan.getBoundingClientRect();
        const yBase = r.bottom - r.top + 14; // ~ -0.1em below the baseline
        const x0 = 6, x1 = r.width + 30;
        const slope = 10; // slight upward slant, left→right
        // hand-drawn wobble: 3 segments with tiny y offsets
        const seg = (x0p, x1p, w, color, o) => {
          const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
          p.setAttribute("d", `M ${x0p} ${yBase + o} L ${x1p} ${yBase - slope + o}`);
          p.setAttribute("stroke", color);
          p.setAttribute("stroke-width", w);
          p.setAttribute("fill", "none");
          p.setAttribute("stroke-linecap", "round");
          const len = Math.hypot(x1p - x0p, slope);
          p.setAttribute("stroke-dasharray", `${len} ${len}`);
          p.setAttribute("stroke-dashoffset", len);
          marker.appendChild(p);
          return { p, len };
        };
        marker.setAttribute("style", `position:absolute;left:${r.left}px;top:${r.top}px;opacity:0`);
        marker.setAttribute("viewBox", `0 0 ${r.width + 40} 160`);
        const wide = seg(x0, x1, 22, rgba(ACCENT, 0.28), 4);   // soft wide base
        const core = seg(x0, x1, 9, ACCENT, 0);                // bright core
        const edge = seg(x0, x1, 2, rgba(255, 255, 255, 0.85), -2); // paper edge highlight
        marker.style.opacity = 1;
        const M0 = t0 + D * 0.56; // title settled at ~0.5D; +4-8f → ~0.56D
        for (const { p, len } of [wide, core, edge]) {
          tl.to(p, { strokeDashoffset: 0, duration: 0.33, ease: "power1.out" }, M0);
        }
        // marker fades out with the title
        tl.to(marker, { autoAlpha: 0, duration: 0.35 }, t0 + D * 0.87);
      };

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- 1 · ENTRANCE (mask reveal, accent line lands last = the payoff) ----------
      tl.to("#kicker", { autoAlpha: 1, letterSpacing: "0.34em", duration: 0.7, ease: "power2.out" }, t0 + 0.05);
      tl.fromTo("#kicker", { letterSpacing: "0.1em" }, { letterSpacing: "0.34em", duration: 0.8, ease: "power2.out" }, t0 + 0.05);
      const first = spans.slice(0, v.accentOn ?? spans.length - 1);
      const rest = v.accentOn !== undefined && v.accentOn < spans.length
        ? spans.slice(v.accentOn, v.accentOn + 1)
        : [];
      tl.from(first, { yPercent: 115, duration: 0.85, stagger: 0.12, ease: "expo.out", filter: "blur(8px)", clearProps: "filter" }, t0 + 0.15);
      if (rest.length) {
        // the accent line slams in a beat later, bigger
        tl.fromTo(rest, { yPercent: 130, scale: 1.12, autoAlpha: 0.2, filter: "blur(14px)" },
          { yPercent: 0, scale: 1, autoAlpha: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, t0 + 0.38);
      }
      tl.fromTo("#glowbar", { width: 0 }, { width: 260, duration: 0.8, ease: "expo.out" }, t0 + 0.3);

      // ---------- 2 · SETTLE + MARKER (0.5D) ----------
      // (drawMarker schedules its own tweens against tl)
      drawMarker();

      // ---------- 3 · AMBIENT ----------
      spans.forEach((s, i) => {
        tl.to(s, { y: i % 2 ? 10 : -10, duration: 2.6 + i * 0.4, ease: "sine.inOut", repeat: -1, yoyo: true }, t0 + 1.4);
      });
      tl.to("#kicker", { opacity: 0.55, duration: 1.6, repeat: -1, yoyo: true, ease: "sine.inOut" }, t0 + 1.4);
      tl.to("#orb1", { x: 220, y: 180, scale: 1.25, duration: 5.5, ease: "sine.inOut", repeat: -1, yoyo: true }, t0);
      tl.to("#orb2", { x: -180, y: -140, scale: 1.2, duration: 6.5, ease: "sine.inOut", repeat: -1, yoyo: true }, t0 + 0.6);
      tl.to("#orb3", { x: 160, y: -200, scale: 1.3, duration: 7.2, ease: "sine.inOut", repeat: -1, yoyo: true }, t0 + 1.1);
      tl.to("#accentglow", { opacity: 0.5, duration: 1.8, repeat: -1, yoyo: true, ease: "sine.inOut" }, t0 + 1.4);

      // ---------- 4 · EMPHASIS (70%) ----------
      const beat = t0 + D * 0.7;
      tl.to(title, { scale: 1.03, duration: 0.5, ease: "power2.out" }, beat);
      tl.to(title, { scale: 1, duration: 0.9, ease: "power4.inOut" }, beat + 0.5);
      tl.fromTo("#accentglow", { opacity: 0.9 }, { opacity: 0, duration: 0.9, ease: "power2.out" }, beat + 0.05);
      tl.to(spans, { y: 0, duration: 0.5, ease: "power2.out" }, beat);

      // ---------- 5 · EXIT (86%) ----------
      const ex = t0 + D * 0.86;
      tl.to(spans, { yPercent: -115, duration: 0.7, stagger: 0.09, ease: "power2.in", filter: "blur(6px)" }, ex);
      tl.to("#kicker", { autoAlpha: 0, y: -18, duration: 0.5, ease: "power2.in" }, ex + 0.1);
      tl.to("#glowbar", { autoAlpha: 0, duration: 0.4 }, ex + 0.1);

      // camera: continuous drift + settle + 3D depth rig
      tl.fromTo("#camera", { scale: 1.0 }, { scale: 1.05, duration: D, ease: "sine.inOut" }, t0);
      tl.to("#camera", { rotation: 0.35, duration: D / 2, ease: "sine.inOut", repeat: 1, yoyo: true }, t0);
      tl.fromTo("#camera", { rotationX: -0.8, rotationY: 1.4 }, { rotationX: 0.9, rotationY: -1.4, duration: D, ease: "sine.inOut", repeat: -1, yoyo: true }, t0);

      // ---------- MAX QUALITY · particles ----------
      if (v.maxMotion) {
        const layer = document.getElementById("maxlayer");
        layer.style.opacity = 1;
        let s = 2468;
        const rnd = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296;
        for (let i = 0; i < 26; i++) {
          const p = document.createElement("div");
          const size = 6 + rnd() * 10;
          p.style.cssText = `position:absolute;width:${size}px;height:${size}px;border-radius:50%;background:${rgba(ACCENT, 0.5)};filter:blur(${(2 + rnd() * 6).toFixed(1)}px);left:${(rnd() * 100).toFixed(1)}%;top:${(rnd() * 100).toFixed(1)}%`;
          layer.appendChild(p);
          tl.to(p, { y: (rnd() - 0.5) * 260, x: (rnd() - 0.5) * 180, opacity: 0.15 + rnd() * 0.35, duration: 3 + rnd() * 4, ease: "sine.inOut", repeat: -1, yoyo: true }, t0 + rnd() * 2);
        }
      }

      window.__timelines["verb-kinetic-title"] = tl;
    </script>
  </body>
</html>
