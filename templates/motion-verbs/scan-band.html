<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"wordmark","type":"string","label":"Wordmark","default":"PRODUCT"},
  {"id":"bandAngle","type":"number","label":"Band angle (deg)","default":12},
  {"id":"accent","type":"color","label":"Accent color","default":"#4f8cff"},
  {"id":"bg","type":"color","label":"Background","default":"#0B0E13"},
  {"id":"textColor","type":"color","label":"Text color","default":"#F2F4F8"},
  {"id":"startMs","type":"number","label":"Scene start (ms)","default":0},
  {"id":"sceneMs","type":"number","label":"Scene duration (ms)","default":8000}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0B0E13; }
      body { font-family: "Inter", sans-serif; }
      #camera { position: absolute; inset: 0; transform-origin: 50% 50%; perspective: 1200px; }
      #root { position: absolute; inset: 0; }
      .orb { position: absolute; border-radius: 50%; filter: blur(130px); will-change: transform; }
      #orb1 { width: 900px; height: 900px; left: -220px; top: -260px; }
      #orb2 { width: 760px; height: 760px; right: -180px; top: 120px; }
      #orb3 { width: 640px; height: 640px; left: 32%; bottom: -260px; }
      #stage { position: absolute; inset: 0; display: grid; place-items: center; }
      .wm { position: relative; font-size: 140px; font-weight: 800; letter-spacing: 0.04em; transform: translateZ(60px); }
      .wm-clip, .wm-stage, .wm-clone { position: absolute; inset: 0; display: grid; place-items: center; }
      .wm-stage { opacity: 0; }
      .wm-clone { filter: blur(1.5px); }
      .band { position: absolute; inset: -40%; opacity: 0; pointer-events: none; }
      #maxlayer { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="verb-scan-band" data-start="0" data-duration="8" data-width="1920" data-height="1080" data-fps="30">
      <div id="camera">
        <div class="orb" id="orb1"></div>
        <div class="orb" id="orb2"></div>
        <div class="orb" id="orb3"></div>
        <div id="stage">
          <div class="wm">
            <div class="wm-stage"></div>
            <div class="band"></div>
          </div>
        </div>
      </div>
      <div id="maxlayer"></div>
    </div>
    <script>
      const v = window.__hyperframes.getVariables();
      const D = (v.sceneMs || 8000) / 1000;
      const t0 = v.startMs / 1000;
      const ACCENT = v.accent || "#4f8cff";
      const TEXT = v.textColor || "#F2F4F8";
      const BG = v.bg || "#0B0E13";
      const WORDMARK = v.wordmark || "PRODUCT";
      const ANGLE = Number(v.bandAngle) || 12;

      const rgba = (hex, a) => {
        const m = /^#?([0-9a-f]{6})$/i.exec(hex);
        if (!m) return `rgba(80,140,255,${a})`;
        const n = parseInt(m[1], 16);
        return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
      };

      document.documentElement.style.background = BG;
      for (const [sel, a] of [["#orb1", 0.3], ["#orb2", 0.24], ["#orb3", 0.2]]) {
        document.querySelector(sel).style.background = rgba(ACCENT, a);
      }

      /* scan-band block: clean wordmark; a diagonal band sweeps across with
         clipped clones giving chroma separation + displacement. */
      const stage = document.querySelector(".wm-stage");
      stage.innerHTML = `<span style="color:${TEXT}">${WORDMARK}</span>`;
      const wmEl = document.querySelector(".wm");
      const band = document.querySelector(".band");
      const W = 1920 * 0.75, H = 1080 * 0.55;
      band.style.cssText = `position:absolute;left:50%;top:50%;width:${W}px;height:${H}px;margin:${-H / 2}px 0 0 ${-W / 2}px;transform:translateX(-140%) rotate(${ANGLE}deg);transform-origin:center;`;
      // clipped clones: red/cyan separation + displacement inside the band
      const mkClone = (color, dx, blur) => {
        const c = document.createElement("div");
        c.className = "wm-clone";
        c.style.cssText = `position:absolute;inset:0;display:grid;place-items:center;transform:translateX(${dx}px);filter:blur(${blur}px);color:${color};mix-blend-mode:screen;`;
        c.textContent = WORDMARK;
        return c;
      };
      band.appendChild(mkClone("#ff3b30", -8, 0.6));
      band.appendChild(mkClone("#00c6ff", 8, 0.6));
      const core = document.createElement("div");
      core.style.cssText = "position:absolute;inset:0;display:grid;place-items:center;";
      core.innerHTML = `<span style="color:${ACCENT};opacity:0.95">${WORDMARK}</span>`;
      band.appendChild(core);
      band.style.background = `linear-gradient(${ANGLE + 90}deg, transparent 20%, rgba(255,255,255,0.07) 50%, transparent 80%)`;

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- 1 · ENTRANCE: clean wordmark fades in ----------
      tl.from(".wm-stage", { autoAlpha: 0, y: 30, duration: 0.6, ease: "power3.out" }, t0 + 0.05);

      // ---------- 2 · THE SCAN (0.3 → 0.75): band sweeps once ----------
      tl.fromTo(band, { opacity: 1, xPercent: -140 }, { xPercent: 140, duration: 0.85, ease: "power2.inOut" }, t0 + 0.3);
      tl.to(band, { opacity: 0, duration: 0.25 }, t0 + 1.1);

      // ---------- 3 · AMBIENT ----------
      const amb = t0 + D * 0.55;
      tl.to(wmEl, { y: 10, duration: 2.6, ease: "sine.inOut", repeat: -1, yoyo: true }, amb);
      tl.to(".wm-stage", { opacity: 0.6, duration: 1.8, repeat: -1, yoyo: true, ease: "sine.inOut" }, amb);
      tl.to("#orb1", { x: 220, y: 180, scale: 1.25, duration: 5.5, ease: "sine.inOut", repeat: -1, yoyo: true }, t0);
      tl.to("#orb2", { x: -180, y: -140, scale: 1.2, duration: 6.5, ease: "sine.inOut", repeat: -1, yoyo: true }, t0 + 0.6);
      tl.to("#orb3", { x: 160, y: -200, scale: 1.3, duration: 7.2, ease: "sine.inOut", repeat: -1, yoyo: true }, t0 + 1.1);

      // ---------- 4 · EMPHASIS: second quick scan = the stamp ----------
      const beat = t0 + D * 0.7;
      tl.fromTo(band, { opacity: 1, xPercent: -140 }, { xPercent: 0, duration: 0.3, ease: "power2.inOut" }, beat);
      tl.to(band, { xPercent: 140, opacity: 0, duration: 0.35, ease: "power2.inOut" }, beat + 0.3);
      tl.fromTo(wmEl, { scale: 1 }, { scale: 1.06, duration: 0.4, ease: "power2.out" }, beat);
      tl.to(wmEl, { scale: 1, duration: 0.7, ease: "power4.inOut" }, beat + 0.4);

      // ---------- 5 · EXIT ----------
      const ex = t0 + D * 0.9;
      tl.to(".wm-stage", { autoAlpha: 0, y: -40, duration: 0.55, ease: "power2.in" }, ex);

      // camera rig
      tl.fromTo("#camera", { scale: 1.0 }, { scale: 1.05, duration: D, ease: "sine.inOut" }, t0);
      tl.fromTo("#camera", { rotationX: -0.6, rotationY: 1.0 }, { rotationX: 0.7, rotationY: -1.0, duration: D, ease: "sine.inOut", repeat: -1, yoyo: true }, t0);

      // ---------- MAX QUALITY · particles ----------
      if (v.maxMotion) {
        const layer = document.getElementById("maxlayer");
        layer.style.opacity = 1;
        let s = 8642;
        const rnd = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296;
        for (let i = 0; i < 24; i++) {
          const p = document.createElement("div");
          const size = 5 + rnd() * 9;
          p.style.cssText = `position:absolute;width:${size}px;height:${size}px;border-radius:50%;background:${rgba(ACCENT, 0.45)};filter:blur(${(2 + rnd() * 5).toFixed(1)}px);left:${(rnd() * 100).toFixed(1)}%;top:${(rnd() * 100).toFixed(1)}%`;
          layer.appendChild(p);
          tl.to(p, { y: (rnd() - 0.5) * 240, x: (rnd() - 0.5) * 160, opacity: 0.12 + rnd() * 0.3, duration: 3 + rnd() * 4, ease: "sine.inOut", repeat: -1, yoyo: true }, t0 + rnd() * 2);
        }
      }

      window.__timelines["verb-scan-band"] = tl;
    </script>
  </body>
</html>
