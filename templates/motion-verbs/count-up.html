<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"label","type":"string","label":"Label","default":"Statistic"},
  {"id":"value","type":"number","label":"Value","default":21819},
  {"id":"display","type":"string","label":"Display override","default":""},
  {"id":"suffix","type":"string","label":"Suffix","default":""},
  {"id":"prefix","type":"string","label":"Prefix","default":""},
  {"id":"accent","type":"color","label":"Accent color","default":"#4f8cff"},
  {"id":"bg","type":"color","label":"Background","default":"#0B0E13"},
  {"id":"textColor","type":"color","label":"Text color","default":"#F2F4F8"},
  {"id":"startMs","type":"number","label":"Scene start (ms)","default":0},
  {"id":"sceneMs","type":"number","label":"Scene duration (ms)","default":8000}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0B0E13; }
      body { font-family: "Inter", sans-serif; }
      #camera { position: absolute; inset: 0; transform-origin: 50% 50%; perspective: 1100px; }
      #depth { position: absolute; inset: 0; transform-style: preserve-3d; }
      #root { position: absolute; inset: 0; }
      .orb { position: absolute; border-radius: 50%; filter: blur(130px); will-change: transform; }
      #orb1 { width: 880px; height: 880px; left: -200px; top: -280px; }
      #orb2 { width: 700px; height: 700px; right: -160px; top: 40px; }
      #orb3 { width: 620px; height: 620px; left: 30%; bottom: -240px; }
      #stage { position: absolute; inset: 0; }
      #value {
        position: absolute; display: flex; align-items: baseline; gap: 16px;
        top: 300px; left: 200px; right: 200px;
        font-size: 250px; font-weight: 800; letter-spacing: -0.035em;
        font-variant-numeric: tabular-nums; line-height: 1; will-change: transform;
        transform: translateZ(70px);
      }
      #prefix, #suffix { font-size: 96px; font-weight: 700; }
      #suffix { color: var(--accent); }
      #label {
        position: absolute; top: 660px; left: 210px; right: 200px;
        font-size: 40px; letter-spacing: 0.14em; text-transform: uppercase;
        overflow: hidden; will-change: letter-spacing, opacity, transform;
      }
      #label span { display: inline-block; }
      #rule { position: absolute; top: 620px; left: 210px; width: 220px; height: 6px; border-radius: 999px; transform-origin: 0 50%; }
      #ring {
        position: absolute; left: 50%; top: 470px; width: 220px; height: 220px;
        margin: -110px 0 0 -110px; border-radius: 50%; border: 6px solid var(--accent, #4f8cff);
        opacity: 0; transform: scale(0.35);
      }
      #halo {
        position: absolute; top: 260px; left: 50%; width: 620px; height: 620px;
        transform: translateX(-50%); filter: blur(90px); opacity: 0; pointer-events: none;
      }
      #confetti { position: absolute; inset: 0; pointer-events: none; }
      .conf { position: absolute; will-change: transform, opacity; border-radius: 2px; }
      #maxlayer { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="verb-count-up" data-start="0" data-duration="8" data-width="1920" data-height="1080" data-fps="30">
      <div id="camera">
        <div id="depth">
          <div class="orb" id="orb1"></div>
          <div class="orb" id="orb2"></div>
          <div class="orb" id="orb3"></div>
        </div>
        <div id="halo"></div>
        <div id="stage">
          <div id="value">
            <span id="prefix"></span>
            <span id="number">0</span>
            <span id="suffix"></span>
          </div>
          <div id="ring"></div>
          <div id="rule"></div>
          <div id="label"></div>
        </div>
        <div id="confetti"></div>
      </div>
      <div id="maxlayer"></div>
    </div>
    <script>
      const v = window.__hyperframes.getVariables();
      const D = (v.sceneMs || 8000) / 1000;
      const t0 = v.startMs / 1000;
      const ACCENT = v.accent || "#4f8cff";
      const TEXT = v.textColor || "#F2F4F8";
      const BG = v.bg || "#0B0E13";

      const rgba = (hex, a) => {
        const m = /^#?([0-9a-f]{6})$/i.exec(hex);
        if (!m) return `rgba(80,140,255,${a})`;
        const n = parseInt(m[1], 16);
        return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
      };

      document.documentElement.style.background = BG;
      document.documentElement.style.setProperty("--accent", ACCENT);
      document.getElementById("prefix").textContent = v.prefix || "";
      document.getElementById("suffix").textContent = v.suffix || "";
      document.getElementById("prefix").style.color = TEXT;
      document.getElementById("suffix").style.color = ACCENT;
      document.getElementById("number").style.color = TEXT;
      document.getElementById("rule").style.background = ACCENT;
      document.getElementById("halo").style.background = rgba(ACCENT, 0.6);
      for (const [sel, a] of [["#orb1", 0.3], ["#orb2", 0.24], ["#orb3", 0.2]]) {
        document.querySelector(sel).style.background = rgba(ACCENT, a);
      }

      const target = Number(v.value) || 0;
      const labelEl = document.getElementById("label");
      const labelText = (v.label || "").toUpperCase();
      const labelSpans = [];
      for (const ch of labelText) {
        const s = document.createElement("span");
        s.textContent = ch;
        labelEl.appendChild(s);
        labelSpans.push(s);
      }
      labelEl.style.color = TEXT;
      const fmt = (n) => {
        if (v.display) return v.display;
        return Math.round(n).toLocaleString("en-US");
      };
      const numEl = document.getElementById("number");

      /* ---- RECIPE: counter-confetti (shotcraft-style) ----
         sprint count easeOutQuart 0.08-0.56 · confetti BURSTS at 0.52
         (a beat BEFORE the number lands — the anticipation is the soul)
         impact ring 0.545 · label tracking tightens 0.62 */
      const T_IN = 0.08, T_LAND = 0.56, T_BURST = 0.52, T_RING = 0.545, T_LABEL = 0.62;

      // 52 deterministic confetti pieces (seeded LCG — no Math.random at runtime)
      const confettiHost = document.getElementById("confetti");
      let seed = 9876;
      const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
      const CONFETTI = 52;
      const pieces = [];
      const PALETTE = [ACCENT, "#F2F4F8", "#F59E0B", "#10B981", "#EF4444", "#E879F9"];
      for (let i = 0; i < CONFETTI; i++) {
        const c = document.createElement("div");
        c.className = "conf";
        const w = 12 + rnd() * 16, h = 6 + rnd() * 8;
        c.style.width = `${w}px`;
        c.style.height = `${h}px`;
        c.style.background = PALETTE[Math.floor(rnd() * PALETTE.length)];
        c.style.opacity = 0;
        const side = i % 2 === 0 ? -1 : 1;
        c.style.left = side < 0 ? `${-30 - rnd() * 220}px` : `${1950 + rnd() * 220}px`;
        c.style.top = `${360 + rnd() * 300}px`;
        confettiHost.appendChild(c);
        pieces.push({ el: c, side, vx: (150 + rnd() * 300) * side, vy: -(230 + rnd() * 220), g: 900 + rnd() * 520, rot: (rnd() - 0.5) * 1500, delay: rnd() * 0.06 });
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- ENTRANCE ----------
      tl.from("#value", { autoAlpha: 0, y: 40, duration: 0.5, ease: "power3.out" }, t0 + 0.05);
      tl.from("#rule", { scaleX: 0, duration: 0.8, ease: "expo.out" }, t0 + 0.15);

      // ---------- THE SPRINT (0.08 → 0.56) ----------
      // number scale: 0.2→1.3 charge-in (outCubic), settles 1.3→1 with a light back-out
      tl.fromTo(numEl, { scale: 0.2, autoAlpha: 0.4 }, { scale: 1.3, autoAlpha: 1, duration: 0.5, ease: "outCubic" }, t0 + T_IN);
      const countObj = { n: 0 };
      tl.to(countObj, {
        n: target, duration: (T_LAND - T_IN) * D, ease: "quart.out",
        onUpdate: () => { numEl.textContent = fmt(countObj.n); },
      }, t0 + T_IN);
      tl.to(numEl, { scale: 1, duration: 0.45, ease: "back.out(1.6)" }, t0 + T_LAND);

      // ---------- ANTICIPATION: confetti bursts BEFORE the number lands ----------
      const BURST = t0 + T_BURST * D;
      pieces.forEach((p, i) => {
        tl.fromTo(p.el,
          { opacity: 0, x: 0, y: 0, rotation: 0 },
          {
            opacity: 0.95, duration: 0.7, ease: "power2.out",
            x: p.vx * 0.55, y: p.vy * 0.55, rotation: p.rot * 0.5,
          }, BURST + p.delay);
        tl.to(p.el,
          {
            y: `+=${(p.g * 0.7).toFixed(0)}`, duration: 0.55, ease: "power1.in",
            x: p.vx * 0.45, rotation: p.rot, opacity: 0.5,
          }, BURST + p.delay + 0.62);
        tl.to(p.el, { opacity: 0, duration: 0.35 }, BURST + p.delay + 1.15);
      });

      // ---------- IMPACT RING at the landing beat ----------
      tl.fromTo("#ring", { opacity: 0.85, scale: 0.35 }, { opacity: 0, scale: 2.95, duration: 0.8, ease: "power2.out" }, t0 + T_RING * D);
      tl.fromTo("#halo", { opacity: 0.8 }, { opacity: 0, duration: 0.9, ease: "power2.out" }, t0 + T_RING * D);

      // ---------- LABEL: tracking tighten (11px → 5px) = the "stamp" ----------
      tl.fromTo("#label", { autoAlpha: 0, y: 22, letterSpacing: "0.24em" }, { autoAlpha: 1, y: 0, letterSpacing: "0.14em", duration: 0.55, ease: "power2.out" }, t0 + T_LABEL * D);
      tl.from(labelSpans, { yPercent: 110, duration: 0.45, stagger: 0.02, ease: "expo.out" }, t0 + T_LABEL * D + 0.05);

      // ---------- AMBIENT (after landing) ----------
      const amb = t0 + D * 0.68;
      tl.to("#value", { y: 10, duration: 2.8, ease: "sine.inOut", repeat: -1, yoyo: true }, amb);
      tl.to("#rule", { opacity: 0.5, duration: 1.8, repeat: -1, yoyo: true, ease: "sine.inOut" }, amb);
      tl.to("#orb1", { x: 200, y: 160, scale: 1.25, duration: 6.0, ease: "sine.inOut", repeat: -1, yoyo: true }, t0);
      tl.to("#orb2", { x: -160, y: -120, scale: 1.2, duration: 6.8, ease: "sine.inOut", repeat: -1, yoyo: true }, t0 + 0.5);
      tl.to("#orb3", { x: 140, y: -180, scale: 1.28, duration: 7.4, ease: "sine.inOut", repeat: -1, yoyo: true }, t0 + 1.0);

      // ---------- EXIT ----------
      const ex = t0 + D * 0.9;
      tl.to("#value", { y: -60, autoAlpha: 0, duration: 0.6, ease: "power2.in" }, ex);
      tl.to("#label", { y: -30, autoAlpha: 0, duration: 0.5, ease: "power2.in" }, ex + 0.08);
      tl.to("#rule", { autoAlpha: 0, duration: 0.4 }, ex + 0.05);

      // camera drift + depth rig
      tl.fromTo("#camera", { scale: 1.0 }, { scale: 1.05, duration: D, ease: "sine.inOut" }, t0);
      tl.fromTo("#camera", { rotationX: -0.7, rotationY: 1.2 }, { rotationX: 0.8, rotationY: -1.2, duration: D, ease: "sine.inOut", repeat: -1, yoyo: true }, t0);

      // ---------- MAX QUALITY · particles ----------
      if (v.maxMotion) {
        const layer = document.getElementById("maxlayer");
        layer.style.opacity = 1;
        let s = 1122;
        const rnd2 = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296;
        for (let i = 0; i < 24; i++) {
          const p = document.createElement("div");
          const size = 5 + rnd2() * 9;
          p.style.cssText = `position:absolute;width:${size}px;height:${size}px;border-radius:50%;background:${rgba(ACCENT, 0.5)};filter:blur(${(2 + rnd2() * 5).toFixed(1)}px);left:${(rnd2() * 100).toFixed(1)}%;top:${(rnd2() * 100).toFixed(1)}%`;
          layer.appendChild(p);
          tl.to(p, { y: (rnd2() - 0.5) * 220, x: (rnd2() - 0.5) * 140, opacity: 0.12 + rnd2() * 0.32, duration: 3 + rnd2() * 4, ease: "sine.inOut", repeat: -1, yoyo: true }, t0 + rnd2() * 2);
        }
      }

      window.__timelines["verb-count-up"] = tl;
    </script>
  </body>
</html>
