<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"label","type":"string","label":"Label","default":"Statistic"},
  {"id":"value","type":"number","label":"Value","default":21819},
  {"id":"display","type":"string","label":"Display override","default":""},
  {"id":"suffix","type":"string","label":"Suffix","default":""},
  {"id":"prefix","type":"string","label":"Prefix","default":""},
  {"id":"accent","type":"color","label":"Accent color","default":"#4f8cff"},
  {"id":"bg","type":"color","label":"Background","default":"#0B0E13"},
  {"id":"textColor","type":"color","label":"Text color","default":"#F2F4F8"},
  {"id":"startMs","type":"number","label":"Scene start (ms)","default":0},
  {"id":"sceneMs","type":"number","label":"Scene duration (ms)","default":8000}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0B0E13; }
      body { font-family: "Inter", sans-serif; }
      #camera { position: absolute; inset: 0; transform-origin: 50% 50%; }
      #root { position: absolute; inset: 0; }
      .orb { position: absolute; border-radius: 50%; filter: blur(130px); will-change: transform; }
      #orb1 { width: 880px; height: 880px; left: -200px; top: -280px; }
      #orb2 { width: 700px; height: 700px; right: -160px; top: 40px; }
      #orb3 { width: 620px; height: 620px; left: 30%; bottom: -240px; }
      #value {
        position: absolute; display: flex; align-items: baseline; gap: 16px;
        top: 300px; left: 200px; right: 200px;
        font-size: 250px; font-weight: 800; letter-spacing: -0.035em;
        font-variant-numeric: tabular-nums; line-height: 1; will-change: transform;
      }
      #prefix, #suffix { font-size: 96px; font-weight: 700; }
      #suffix { color: var(--accent); }
      #label {
        position: absolute; top: 640px; left: 210px; right: 200px;
        font-size: 40px; letter-spacing: 0.14em; text-transform: uppercase;
        overflow: hidden;
      }
      #label span { display: inline-block; will-change: transform; }
      #rule { position: absolute; top: 596px; left: 210px; width: 240px; height: 6px; border-radius: 999px; transform-origin: 0 50%; }
      #shimmer {
        position: absolute; top: 0; left: 0; height: 100%; width: 60%;
        background: linear-gradient(100deg, transparent, rgba(255,255,255,0.5), transparent);
        transform: translateX(-120%);
      }
      #halo {
        position: absolute; top: 260px; left: 50%; width: 620px; height: 620px;
        transform: translateX(-50%); filter: blur(90px); opacity: 0; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="verb-count-up" data-start="0" data-duration="8" data-width="1920" data-height="1080" data-fps="30">
      <div id="camera">
        <div class="orb" id="orb1"></div>
        <div class="orb" id="orb2"></div>
        <div class="orb" id="orb3"></div>
        <div id="halo"></div>
      </div>
      <div class="clip" data-start="0" data-duration="7.6" data-track-index="1">
        <div id="value">
          <span id="prefix"></span>
          <span id="number">0</span>
          <span id="suffix"></span>
        </div>
        <div id="rule"><div id="shimmer"></div></div>
        <div id="label"></div>
      </div>
    </div>
    <script>
      const v = window.__hyperframes.getVariables();
      const D = (v.sceneMs || 8000) / 1000;
      const t0 = v.startMs / 1000;
      const ACCENT = v.accent || "#4f8cff";
      const TEXT = v.textColor || "#F2F4F8";
      const BG = v.bg || "#0B0E13";

      const rgba = (hex, a) => {
        const m = /^#?([0-9a-f]{6})$/i.exec(hex);
        if (!m) return `rgba(80,140,255,${a})`;
        const n = parseInt(m[1], 16);
        return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
      };

      document.documentElement.style.background = BG;
      document.getElementById("suffix").style.color = ACCENT;
      document.getElementById("rule").style.background = ACCENT;
      document.getElementById("halo").style.background = rgba(ACCENT, 0.6);
      document.getElementById("prefix").textContent = v.prefix || "";
      document.getElementById("suffix").textContent = v.suffix || "";
      document.getElementById("prefix").style.color = TEXT;
      document.getElementById("suffix").style.color = ACCENT;
      document.getElementById("number").style.color = TEXT;
      document.getElementById("label").style.color = TEXT;
      for (const [sel, a] of [["#orb1", 0.3], ["#orb2", 0.24], ["#orb3", 0.2]]) {
        document.querySelector(sel).style.background = rgba(ACCENT, a);
      }

      const target = Number(v.value) || 0;
      const labelEl = document.getElementById("label");
      const labelText = (v.label || "").toUpperCase();
      const labelSpans = [];
      for (const ch of labelText) {
        const s = document.createElement("span");
        s.textContent = ch;
        labelEl.appendChild(s);
        labelSpans.push(s);
      }
      const fmt = (n) => {
        if (v.display) return v.display;
        return Math.round(n).toLocaleString("en-US");
      };
      const numEl = document.getElementById("number");

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- 1 · ENTRANCE ----------
      tl.from("#value", { autoAlpha: 0, y: 40, duration: 0.7, ease: "power3.out" }, t0 + 0.1);
      tl.from("#rule", { scaleX: 0, duration: 0.9, ease: "expo.out" }, t0 + 0.35);
      tl.from(labelSpans, { yPercent: 110, duration: 0.6, stagger: 0.03, ease: "expo.out" }, t0 + 0.5);
      tl.from("#suffix, #prefix", { autoAlpha: 0, y: 16, duration: 0.5, ease: "power2.out" }, t0 + 0.6);

      // ---------- 2 · THE COUNT (10% → 55%) ----------
      const countObj = { n: 0 };
      tl.to(countObj, {
        n: target, duration: D * 0.45, ease: "power2.out",
        onUpdate: () => { numEl.textContent = fmt(countObj.n); },
      }, t0 + D * 0.1);
      // wobble while counting
      tl.to("#value", { scale: 1.03, duration: 0.4, ease: "sine.inOut", repeat: 7, yoyo: true }, t0 + D * 0.12);

      // ---------- 3 · AMBIENT (55% → 70%) — always moving ----------
      tl.to("#value", { y: 10, duration: 2.8, ease: "sine.inOut", repeat: -1, yoyo: true }, t0 + D * 0.55);
      tl.to("#shimmer", { x: "520%", duration: 2.2, ease: "power1.inOut", repeat: -1 }, t0 + D * 0.55);
      tl.to("#label", { opacity: 0.6, duration: 1.8, repeat: -1, yoyo: true, ease: "sine.inOut" }, t0 + D * 0.56);
      tl.to("#orb1", { x: 200, y: 160, scale: 1.25, duration: 6.0, ease: "sine.inOut", repeat: -1, yoyo: true }, t0);
      tl.to("#orb2", { x: -160, y: -120, scale: 1.2, duration: 6.8, ease: "sine.inOut", repeat: -1, yoyo: true }, t0 + 0.5);
      tl.to("#orb3", { x: 140, y: -180, scale: 1.28, duration: 7.4, ease: "sine.inOut", repeat: -1, yoyo: true }, t0 + 1.0);

      // ---------- 4 · EMPHASIS (70% → 82%) ----------
      const beat = t0 + D * 0.7;
      tl.to("#value", { scale: 1.07, duration: 0.45, ease: "power2.out" }, beat);
      tl.to("#value", { scale: 1, duration: 1.0, ease: "power4.inOut" }, beat + 0.45);
      tl.fromTo("#halo", { opacity: 0.75 }, { opacity: 0, duration: 1.1, ease: "power2.out" }, beat);
      tl.fromTo("#rule", { scaleX: 1 }, { scaleX: 1.15, transformOrigin: "0 50%", duration: 0.5, ease: "power2.out" }, beat);
      tl.to("#rule", { scaleX: 1, duration: 0.7, ease: "power3.inOut" }, beat + 0.5);

      // ---------- 5 · EXIT (86% → 100%) ----------
      const ex = t0 + D * 0.86;
      tl.to("#value", { y: -60, autoAlpha: 0, duration: 0.65, ease: "power2.in" }, ex);
      tl.to("#label", { y: -30, autoAlpha: 0, duration: 0.55, ease: "power2.in" }, ex + 0.08);
      tl.to("#rule", { autoAlpha: 0, duration: 0.4 }, ex + 0.05);

      // camera drift
      tl.fromTo("#camera", { scale: 1.0 }, { scale: 1.06, duration: D, ease: "sine.inOut" }, t0);

      window.__timelines["verb-count-up"] = tl;
    </script>
  </body>
</html>
